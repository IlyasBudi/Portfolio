backend:
  name: github        # menggunakan backend GitHub:contentReference[oaicite:4]{index=4}
  repo: IlyasBudi/Portfolio  # ganti dengan owner/repo Anda sendiri
  branch: dev        # branch yang diupdate
  base_url: https://portfolio-git-dev-ilyas-budis-projects.vercel.app  # domain situs Anda setelah deploy
  auth_endpoint: api/auth      # endpoint OAuth kustom:contentReference[oaicite:5]{index=5}

media_folder: public/images/projects   # folder upload di repo:contentReference[oaicite:6]{index=6}
public_folder: /images/projects        # path publik untuk gambar:contentReference[oaicite:7]{index=7}

# publish_mode: editorial_workflow    # mengaktifkan editorial workflow (draft, ready, published)
open_authoring: false               # false karena repo public dan Anda punya akses push penuh

collections:
  - name: "project"
    label: "Projects"
    folder: src/content/projects    # lokasi file markdown proyek:contentReference[oaicite:8]{index=8}
    create: true                    # boleh membuat entry baru
    slug: "{{slug}}"                # slug file berdasarkan judul
    format: "frontmatter"
    summary: "{{title}} — {{category}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Description", name: "description", widget: "string", required: true }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Tech Stack", name: "techStack", widget: "list", 
          field: { label: "Tech", name: "tech", widget: "string" } }
      - { label: "Demo Link", name: "demoLink", widget: "string", required: false }
      - { label: "GitHub Link", name: "githubLink", widget: "string", required: false }
      - { label: "Image", name: "image", widget: "image", required: true }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Content", name: "body", widget: "markdown", required: false }
